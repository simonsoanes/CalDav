# CI/CD for Nullify.CalDav: the test suite, then the server image pushed to the Gitea container registry as
# git.nullify.net/simon/nullify-caldav.
#
# Secrets (same names as the other Nullify/Fizl repositories):
#   GITEADOCKERTOKEN         Gitea access token with package write for user "simon" (registry login).
#   CALDAV_PORTAINER_WEBHOOK Optional Portainer stack/service webhook URL; when set, main and tag builds redeploy.
#
# Tags: every build pushes :<commit sha>; main pushes :latest; a v1.2.3 tag pushes :1.2.3, :1.2 and :latest.
name: CalDav CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

env:
  IMAGE: git.nullify.net/simon/nullify-caldav

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Prune Docker build cache before building
        run: docker builder prune -f --filter until=72h || true

      - name: Determine version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"; version="${version#v}"
          else
            version="0.0.0-ci.$(echo "${{ github.sha }}" | cut -c1-8)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Building version $version"

      # Runs the test suite inside the SDK stage of the Dockerfile, so the runner needs no .NET.
      - name: Tests
        run: docker build --target test --build-arg VERSION="$VERSION" .

      - name: Build image
        run: |
          docker build --build-arg VERSION="$VERSION" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE:${{ github.sha }}" .

      # The runtime image has no curl, so probe it from a curl container sharing its network namespace.
      - name: Smoke test image
        run: |
          docker run -d --name caldav-smoke "$IMAGE:${{ github.sha }}"
          probe() { docker run --rm --network container:caldav-smoke curlimages/curl:8.11.1 -sS "$@"; }
          for i in $(seq 1 30); do
            probe -f -o /dev/null http://127.0.0.1:8080/health 2>/dev/null && break
            sleep 2
          done
          docker logs caldav-smoke 2>&1 | tail -n 20
          probe -f http://127.0.0.1:8080/health | grep -q Healthy
          probe -f http://127.0.0.1:8080/setup | grep -q "Create administrator"
          test "$(probe -o /dev/null -w '%{http_code}' -X PROPFIND http://127.0.0.1:8080/dav/)" = "503"
          test "$(probe -o /dev/null -w '%{http_code}' -X OPTIONS http://127.0.0.1:8080/dav/)" = "503"

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITEADOCKERTOKEN }}" | docker login -u simon --password-stdin https://git.nullify.net/

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            minor="$(echo "$VERSION" | cut -d. -f1-2)"
            for tag in "$VERSION" "$minor" latest; do
              docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$tag"
              docker push "$IMAGE:$tag"
            done
          fi

      - name: Deploy
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        env:
          WEBHOOK: ${{ secrets.CALDAV_PORTAINER_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then curl -fsS -X POST "$WEBHOOK"; else echo "CALDAV_PORTAINER_WEBHOOK not set; skipping deploy."; fi

      - name: Clean up
        if: always()
        run: |
          docker rm -f caldav-smoke 2>/dev/null || true
          docker logout https://git.nullify.net/ 2>/dev/null || true
          docker image rm "$IMAGE:${{ github.sha }}" "$IMAGE:latest" 2>/dev/null || true
          docker builder prune -f --filter until=72h || true
