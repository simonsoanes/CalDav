# Nullify.CalDav behind Caddy (automatic HTTPS).
# Copy .env.example to .env and set your host names, then: docker compose up -d --build
services:
  caldav:
    build: .
    image: nullify-caldav:latest
    container_name: nullify-caldav
    restart: unless-stopped
    # Only reachable through Caddy; the app trusts X-Forwarded-* headers from private networks by default.
    expose:
      - "8080"
    volumes:
      - caldav-data:/data
    environment:
      - PublicUrl=https://${DAV_HOST:-dav.example.com}
      - TZ=UTC
      # Optional: require this token on the first-run setup page.
      - Setup__Token=${SETUP_TOKEN:-}

  caddy:
    image: caddy:2
    container_name: nullify-caddy
    restart: unless-stopped
    depends_on:
      - caldav
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DAV_HOST=${DAV_HOST:-dav.example.com}
      - AUTOCONFIG_HOST=${AUTOCONFIG_HOST:-autoconfig.example.com}
      - AUTODISCOVER_HOST=${AUTODISCOVER_HOST:-autodiscover.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caldav-data:
  caddy-data:
  caddy-config:
